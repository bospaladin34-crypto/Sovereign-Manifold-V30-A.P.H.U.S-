name: Sovereign Release Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v60.0.0)'
        required: false
        default: 'v60.0.0'

permissions:
  contents: write

concurrency:
  group: release-packager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-release:
    name: Package & Publish Autonomous Release
    runs-on: windows-latest
    steps:
      - name: Checkout Sovereign Manifold Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '05_hud_cockpit/package-lock.json'

      - name: Build WebGPU HUD Cockpit
        shell: pwsh
        run: |
          cd 05_hud_cockpit
          npm ci
          npm run build

      - name: Package Distribution Bundles
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } elseif ("${{ inputs.tag_name }}") { "${{ inputs.tag_name }}" } else { "v60.0.0" }
          New-Item -ItemType Directory -Path "release_artifacts" -Force | Out-Null
          
          Compress-Archive -Path "docs\*" -DestinationPath "release_artifacts\act-omega-hud-cockpit-$ver.zip" -Force
          Compress-Archive -Path "03_vault\lean4\*" -DestinationPath "release_artifacts\act-omega-lean4-theorems-$ver.zip" -Force
          
          if (Test-Path "SovereignCockpitHUD.exe") {
              Copy-Item "SovereignCockpitHUD.exe" "release_artifacts\SovereignCockpitHUD.exe" -Force
          } elseif (Test-Path "docs\SovereignCockpitHUD.exe") {
              Copy-Item "docs\SovereignCockpitHUD.exe" "release_artifacts\SovereignCockpitHUD.exe" -Force
          }
          
          if (Test-Path "telemetry_snapshot.json") {
              Copy-Item "telemetry_snapshot.json" "release_artifacts\telemetry_snapshot.json" -Force
          }
          if (Test-Path "CITATION.cff") {
              Copy-Item "CITATION.cff" "release_artifacts\CITATION.cff" -Force
          }
          if (Test-Path ".zenodo.json") {
              Copy-Item ".zenodo.json" "release_artifacts\.zenodo.json" -Force
          }

          cd release_artifacts
          Get-FileHash -Algorithm SHA256 * | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
          name: ACT-Omega Net ${{ github.ref_name || inputs.tag_name || 'v60.0.0' }} Production Release
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v60.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
