name: Sovereign Autonomous Telemetry Pulse

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-pulse
  cancel-in-progress: true

jobs:
  telemetry-pulse:
    name: Repository Telemetry & Architecture Pulse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Manifold Repository
        uses: actions/checkout@v4

      - name: Inspect Telemetry Snapshot & Metadata
        shell: bash
        run: |
          echo "### Sovereign Manifold v50.2.0 Telemetry Pulse" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp (UTC) | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "telemetry_snapshot.json" ]; then
            echo "| Telemetry Snapshot | Present & Validated |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Telemetry Snapshot | MISSING |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if grep -q "10.5281/zenodo.23651696" docs/index.html || grep -q "10.5281/zenodo.23651696" GEMINI.md || grep -q "10.5281/zenodo.23651696" .zenodo.json; then
            echo "| Zenodo Permanent DOI | 10.5281/zenodo.23651696 (Verified) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Zenodo Permanent DOI | MISMATCH |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if grep -q "10.17605/OSF.IO/2XQ5Z" docs/index.html || grep -q "10.17605/OSF.IO/2XQ5Z" GEMINI.md || grep -q "10.17605/OSF.IO/2XQ5Z" CITATION.cff; then
            echo "| OSF Permanent DOI | 10.17605/OSF.IO/2XQ5Z (Verified) |" >> $GITHUB_STEP_SUMMARY
          fi

          THM_COUNT=$(grep -c "^theorem " 03_vault/lean4/SovereignManifoldTheorems.lean || true)
          echo "| Lean 4 Theorems (QED) | $THM_COUNT / 564+ |" >> $GITHUB_STEP_SUMMARY

      - name: Check Live Edge Endpoint (Non-blocking)
        shell: bash
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://act-omega-net.dev/ || echo "000")
          echo "| Public WebGPU Portal (act-omega-net.dev) | HTTP $HTTP_CODE |" >> $GITHUB_STEP_SUMMARY
          echo "Pulse completed successfully."
