name = "sovereign-paid-workflow"
main = "worker_paid_workflow.js"
compatibility_date = "2026-07-28"
account_id = "a37cf8ab07e7c5f886c302be3f098744"
workers_dev = false

[limits]
cpu_ms = 30000

[observability]
enabled = true

[vars]
VPC_TUNNEL_NAME = "sovereign-vpc-mesh"
