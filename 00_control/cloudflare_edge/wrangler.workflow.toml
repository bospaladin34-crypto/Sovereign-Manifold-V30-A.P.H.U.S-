[[workflows]]
name = "act-omega-audit-sync-workflow"
binding = "ACT_OMEGA_WORKFLOW"
class_name = "SovereignAuditSyncWorkflow"

[[hyperdrive]]
binding = "ACT_OMEGA_HYPERDRIVE"
id = "934af8d9f02d471cb383cb8c90ddfe51"

[[vpc_services]]
binding = "ANCHOR_L0_VPC"
service_id = "01a1ed54-a2aa-75a1-b26d-87a034b759be"

[[vpc_services]]
binding = "DENO_L2_VPC"
service_id = "01a1ed54-b4ba-7730-914d-31040f471569"

[[vpc_services]]
binding = "PIXEL10_EDGE_VPC"
service_id = "01a1ed54-c4be-7112-97b3-7a563ab6ba16"

[[vpc_services]]
