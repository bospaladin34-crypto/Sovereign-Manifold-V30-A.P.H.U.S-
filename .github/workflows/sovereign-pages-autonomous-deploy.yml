name: Sovereign Pages Autonomous Deploy

on:
  push:
    branches:
      - vesper_production
      - gh-pages
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Sovereign HUD Static Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Manifold Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '05_hud_cockpit/package-lock.json'

      - name: Install Dependencies
        run: |
          cd 05_hud_cockpit
          npm ci

      - name: Build WebGPU HUD Cockpit Bundle
        run: |
          cd 05_hud_cockpit
          npm run build

      - name: Sync Dist to Docs & Verify SSR Attributes
        shell: bash
        run: |
          mkdir -p docs/assets
          cp -r 05_hud_cockpit/dist/* docs/
          if ! grep -q 'data-sovereign-ssr="v50.2.0"' docs/index.html; then
            echo "ERROR: docs/index.html missing data-sovereign-ssr attribute"
            exit 1
          fi
          touch docs/.nojekyll
          echo "Verified docs/index.html SSR pre-population and .nojekyll"

      - name: Upload Verified Pages Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-hud-pages-bundle-${{ github.ref_name }}
          path: './docs'
          if-no-files-found: error

  verify-live-pages:
    name: Verify Live GitHub Pages & SSR Bundle Health
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Probe Live GitHub Pages Endpoint & SSR Payload
        shell: bash
        run: |
          PAGE_URL="https://bospaladin34-crypto.github.io/Sovereign-Manifold-V30-A.P.H.U.S-/"
          HTTP_STATUS=$(curl -s -L -o /tmp/gh_pages_index.html -w "%{http_code}" "$PAGE_URL")
          echo "GitHub Pages HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Expected HTTP 200 from $PAGE_URL, got $HTTP_STATUS"
            exit 1
          fi
          if ! grep -q 'data-sovereign-ssr="v50.2.0"' /tmp/gh_pages_index.html; then
            echo "WARNING: Live GitHub Pages propagation in progress"
          else
            echo "Verified data-sovereign-ssr=v50.2.0 live on GitHub Pages!"
          fi
          echo "### GitHub Pages Autonomous Verification" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: $PAGE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP Status**: $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
