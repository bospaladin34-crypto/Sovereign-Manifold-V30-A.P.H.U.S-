name: Sovereign Brutal Gatekeeper CI

on:
  push:
    branches:
      - main
      - vesper_production
      - gh-pages
  pull_request:
    branches:
      - main
      - vesper_production
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatekeeper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper-audit:
    name: Brutal Gatekeeper Invariants & Verification Audit
    runs-on: windows-latest
    steps:
      - name: Checkout Sovereign Manifold Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify L0 Rust Compilation
        shell: pwsh
        run: |
          Write-Host "Checking L0 Rust Core library..." -ForegroundColor Cyan
          cargo check --lib --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Origin Swarm binary..." -ForegroundColor Cyan
          cargo check --bin v31_swarm --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Brain Trainer binary..." -ForegroundColor Cyan
          cargo check --bin v50_brain_trainer --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Full Manifest..." -ForegroundColor Cyan
          cargo check --manifest-path 01_l0_rust/Cargo.toml

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '05_hud_cockpit/package-lock.json'

      - name: Build WebGPU HUD Cockpit
        shell: pwsh
        run: |
          cd 05_hud_cockpit
          npm ci
          npm run build

      - name: Verify Lean 4 Formal Theorems
        shell: pwsh
        run: |
          $leanVault = "03_vault/lean4/SovereignManifoldTheorems.lean"
          $leanL0 = "01_l0_rust/lean4/SovereignManifoldTheorems.lean"
          if (-not (Test-Path $leanVault) -or -not (Test-Path $leanL0)) {
              throw "Lean 4 theorems file missing!"
          }
          $h1 = (Get-FileHash $leanVault -Algorithm SHA256).Hash
          $h2 = (Get-FileHash $leanL0 -Algorithm SHA256).Hash
          if ($h1 -ne $h2) {
              throw "Lean 4 parity drift between 03_vault and 01_l0_rust!"
          }
          $content = [System.IO.File]::ReadAllText($leanVault)
          $thms = ([regex]::Matches($content, '(?m)^theorem\s+')).Count
          $sorry = ([regex]::Matches($content, '\bsorry\b')).Count
          $triv1 = ([regex]::Matches($content, ':\s*(\w+)\s*=\s*\1\s*:=')).Count
          $triv2 = ([regex]::Matches($content, '\(a\s+b\s*:\s*Nat\)\s*:\s*a\s*\+\s*b\s*=\s*b\s*\+\s*a')).Count
          $triv3 = ([regex]::Matches($content, '\((\d+)\s*=\s*\1\)')).Count
          Write-Host "Lean 4 Theorems: $thms (Req: >= 564)" -ForegroundColor Green
          Write-Host "Sorry Count: $sorry (Req: 0)" -ForegroundColor Green
          Write-Host "Trivial Padding Count: $($triv1 + $triv2 + $triv3) (Req: 0)" -ForegroundColor Green
          if ($thms -lt 564 -or $sorry -gt 0 -or ($triv1 + $triv2 + $triv3) -gt 0) {
              throw "Lean 4 formal theorem check failed!"
          }
          if (Get-Command lean -ErrorAction SilentlyContinue) {
              Write-Host "Running lean compiler on 03_vault/lean4/SovereignManifoldTheorems.lean..." -ForegroundColor Cyan
              lean $leanVault
          }

      - name: Run PowerShell Static Gatekeeper Invariants Audit
        shell: pwsh
        run: |
          Write-Host "Executing 00_control/Invoke-BrutalAgentGatekeeper.ps1 -StaticOnly..." -ForegroundColor Cyan
          & "00_control/Invoke-BrutalAgentGatekeeper.ps1" -StaticOnly

      - name: Optional Gated Cloudflare Edge / Operator Check
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Cloudflare API token detected. Running edge verification probe..." -ForegroundColor Green
          $resp = Invoke-WebRequest -Uri "https://act-omega-net.dev/" -UseBasicParsing -TimeoutSec 10
          Write-Host "Edge Status: $($resp.StatusCode)" -ForegroundColor Green
