name = "sovereign-loq15-vpc-shadow"
main = "worker_vpc_shadow_v3700.js"
compatibility_date = "2026-07-28"
account_id = "a37cf8ab07e7c5f886c302be3f098744"

[limits]
cpu_ms = 30000

[observability]
enabled = true
head_sampling_rate = 1.0

# --- Cloudflare Tier 4: Zero Trust & Turnstile Variables ---
# NOTE: Production TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY as well as SOVEREIGN_OPERATOR_KEY
# are provisioned exclusively via encrypted Cloudflare secrets (wrangler secret put)
# and must never be committed in plaintext repository configurations.
[vars]
CF_ACCESS_TEAM_DOMAIN = "act-omega-net.cloudflareaccess.com"
CF_ACCESS_AUD = "act-omega-zero-trust-aud"

# --- Cloudflare Tier 3: Workers AI (bge-small-en-v1.5) ---
[ai]
binding = "AI"

# --- Cloudflare D1 Vault (Remote 5GB 10-Table SQLite Database) ---
[[d1_databases]]
binding = "ACT_OMEGA_D1"
database_name = "act_omega_d1_vault"
database_id = "9f46d56a-ef3e-4232-a9ac-c4bd12e20a87"

# --- Cloudflare Durable Object (SovereignEdgeShadowDO SQLite Continuum) ---
[[durable_objects.bindings]]
name = "SOVEREIGN_EDGE_SHADOW_DO"
class_name = "SovereignEdgeShadowDO"

# --- Cloudflare Durable Object Migrations ---
[[migrations]]
tag = "v3800"
new_sqlite_classes = ["SovereignEdgeShadowDO"]

# --- Cloudflare Tier 1: Vectorize (MIT Hot E8Q 384D Vector Index) ---
[[vectorize]]
binding = "ACT_OMEGA_VECTORIZE"
index_name = "act-omega-mit-e8q-index"

# --- Cloudflare Tier 2: R2 Vault (Class B Caching & HTTP 206 Slicing) ---
[[r2_buckets]]
binding = "ACT_OMEGA_R2_VAULT"
bucket_name = "act-omega-r2-vault"

# --- Cloudflare Tier 5: Workers KV (60s Cache & 120s Write Debounce) ---
[[kv_namespaces]]
binding = "ACT_OMEGA_KV"
id = "65bc6848257345ce988e31a8b6571b6d" # act_omega_kv_vault

# --- Cloudflare Tier 6: Analytics Engine (Edge Telemetry & D1 Rollup) ---
[[analytics_engine_datasets]]
binding = "ACT_OMEGA_ANALYTICS"
dataset = "act_omega_edge_telemetry"

# --- Cloudflare Workers Paid: Queues Telemetry WAL & DLQ ---
[[queues.producers]]
binding = "ACT_OMEGA_WAL_QUEUE"
queue = "act-omega-telemetry-wal-queue"

[[queues.consumers]]
queue = "act-omega-telemetry-wal-queue"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "act-omega-dlq"

# --- Cloudflare Workers Paid: Cross-Script Workflow Binding ---
[[workflows]]
name = "act-omega-audit-sync-workflow"
binding = "ACT_OMEGA_WORKFLOW"
class_name = "SovereignAuditSyncWorkflow"
script_name = "sovereign-paid-workflow"

# --- Cloudflare Cron Triggers (5-Minute Paid Sync Pulse) ---
[triggers]
crons = ["*/5 * * * *"]

# --- Cloudflare Workers Paid: Hyperdrive -> Local TLS PGWire DuckDB (:5439) ---
[[hyperdrive]]
binding = "ACT_OMEGA_HYPERDRIVE"
id = "934af8d9f02d471cb383cb8c90ddfe51"

# --- Cloudflare Workers VPC Services (Tunnel da52a9b3 sovereign-vpc-mesh QUIC) ---
[[vpc_services]]
binding = "ANCHOR_L0_VPC"
service_id = "01a1ed54-a2aa-75a1-b26d-87a034b759be"

[[vpc_services]]
binding = "DENO_L2_VPC"
service_id = "01a1ed54-b4ba-7730-914d-31040f471569"

[[vpc_services]]
binding = "PIXEL10_EDGE_VPC"
service_id = "01a1ed54-c4be-7112-97b3-7a563ab6ba16"

[[vpc_services]]
binding = "PIXEL8_APEX_VPC"
service_id = "01a1ed54-d351-7fc3-aed2-3989d5385ddc"

# --- Service Binding to Isolated Paid Workflow/Sockets Worker ---
[[services]]
binding = "ACT_OMEGA_WORKFLOW_SVC"
service = "sovereign-paid-workflow"
