name = "sovereign-paid-workflow"
main = "worker_paid_workflow.js"
compatibility_date = "2026-07-28"
account_id = "<EXTERNAL_CF_ACCOUNT_ID>"
workers_dev = false

[limits]
cpu_ms = 30000

[observability]
enabled = true

[vars]
VPC_TUNNEL_NAME = "sovereign-vpc-mesh"
CF_VNET_NAME = "default"

[[d1_databases]]
binding = "ACT_OMEGA_D1"
database_name = "act_omega_d1_vault"
database_id = "<EXTERNAL_D1_DATABASE_ID>"

[[workflows]]
name = "act-omega-audit-sync-workflow"
binding = "ACT_OMEGA_WORKFLOW"
class_name = "SovereignAuditSyncWorkflow"

[[hyperdrive]]
binding = "ACT_OMEGA_HYPERDRIVE"
id = "<EXTERNAL_HYPERDRIVE_ID>"

[[vpc_services]]
binding = "ANCHOR_L0_VPC"
service_id = "<EXTERNAL_VPC_ANCHOR_ID>"

[[vpc_services]]
binding = "DENO_L2_VPC"
service_id = "<EXTERNAL_VPC_DENO_ID>"

[[vpc_services]]
binding = "PIXEL10_EDGE_VPC"
service_id = "<EXTERNAL_VPC_P10_ID>"

[[vpc_services]]
binding = "PIXEL8_APEX_VPC"
service_id = "<EXTERNAL_VPC_P8_ID>"
