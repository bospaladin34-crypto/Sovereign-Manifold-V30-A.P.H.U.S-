[package]
name = "act_omega_l0_core"
version = "30.0.0"
edition = "2021"
authors = ["Sovereign Manifold Team"]
description = "ACT-Omega v30.0 Deterministic Topological Compute Core"

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
rayon = "1.10"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "v31_swarm"
path = "src/bin/v31_swarm.rs"

[[bin]]
name = "v50_brain_trainer"
path = "src/v50_brain_63360_144subdomains_qat_trainer.rs"

[[bin]]
name = "v31_bench"
path = "src/bin/v31_bench.rs"

[[bin]]
name = "v31_harvester"
path = "src/bin/v31_harvester.rs"

[[bin]]
name = "v31_trainer"
path = "src/bin/v31_trainer.rs"