name: Sovereign Brutal Gatekeeper CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - vesper_production
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gatekeeper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper-audit:
    name: Brutal Gatekeeper Invariants & Verification Audit
    runs-on: windows-latest
    steps:
      - name: Checkout Sovereign Manifold Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify L0 Rust Compilation
        shell: pwsh
        run: |
          Write-Host "Checking L0 Rust Core library..." -ForegroundColor Cyan
          cargo check --lib --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Origin Swarm binary..." -ForegroundColor Cyan
          cargo check --bin v31_swarm --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Brain Trainer binary..." -ForegroundColor Cyan
          cargo check --bin v50_brain_trainer --manifest-path 01_l0_rust/Cargo.toml
          Write-Host "Checking L0 Full Manifest..." -ForegroundColor Cyan
          cargo check --manifest-path 01_l0_rust/Cargo.toml

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '05_hud_cockpit/package-lock.json'

      - name: Verify WebGPU HUD Cockpit Production Build (Isolated OutDir)
        shell: pwsh
        run: |
          $ciDist = Join-Path $env:RUNNER_TEMP "hud_ci_dist"
          Push-Location 05_hud_cockpit
          try {
              npm ci
              npx vite build --outDir $ciDist
              if ($LASTEXITCODE -ne 0) { throw "Vite HUD build failed" }
          } finally {
              Pop-Location
          }
          if (-not (Test-Path (Join-Path $ciDist "index.html"))) {
              throw "Expected built index.html in $ciDist"
          }

      - name: Verify Zero-Square-Bracket L0 Rust & Worker Unit Suites
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "00_control/Scan-ZeroSquareBrackets.ps1" -RepoRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Scan-ZeroSquareBrackets failed" }
          node tests/e2e/m1_worker_do_unit.mjs
          if ($LASTEXITCODE -ne 0) { throw "m1_worker_do_unit.mjs failed" }
          node tests/e2e/test_m1_worker_dispatch_verification.mjs
          if ($LASTEXITCODE -ne 0) { throw "test_m1_worker_dispatch_verification.mjs failed" }

      - name: Install Lean 4 Toolchain (elan) & Verify 1,027+ Formal Theorems QED
        shell: pwsh
        run: |
          $leanVault = "03_vault/lean4/SovereignManifoldTheorems.lean"
          $leanL0 = "01_l0_rust/lean4/SovereignManifoldTheorems.lean"
          if (-not (Test-Path $leanVault) -or -not (Test-Path $leanL0)) {
              throw "Lean 4 theorems file missing!"
          }
          $h1 = (Get-FileHash $leanVault -Algorithm SHA256).Hash
          $h2 = (Get-FileHash $leanL0 -Algorithm SHA256).Hash
          if ($h1 -ne $h2) {
              throw "Lean 4 parity drift between 03_vault and 01_l0_rust!"
          }
          $content = [System.IO.File]::ReadAllText($leanVault)
          $thms = ([regex]::Matches($content, '(?m)^\s*theorem\s+')).Count
          $sorry = ([regex]::Matches($content, '\bsorry\b')).Count
          $axioms = ([regex]::Matches($content, '(?m)^\s*axiom\b')).Count
          $triv1 = ([regex]::Matches($content, ':\s*(\w+)\s*=\s*\1\s*:=')).Count
          $triv2 = ([regex]::Matches($content, '\(a\s+b\s*:\s*Nat\)\s*:\s*a\s*\+\s*b\s*=\s*b\s*\+\s*a')).Count
          $triv3 = ([regex]::Matches($content, '\((\d+)\s*=\s*\1\)')).Count
          Write-Host "Lean 4 Theorems: $thms (Req: >= 1027)" -ForegroundColor Green
          Write-Host "Sorry/Axiom Count: $($sorry + $axioms) (Req: 0)" -ForegroundColor Green
          Write-Host "Trivial Padding Count: $($triv1 + $triv2 + $triv3) (Req: 0)" -ForegroundColor Green
          if ($thms -lt 1027 -or ($sorry + $axioms) -gt 0 -or ($triv1 + $triv2 + $triv3) -gt 0) {
              throw "Lean 4 formal theorem check failed!"
          }
          if (-not (Get-Command lean -ErrorAction SilentlyContinue)) {
              $elanZip = Join-Path $env:RUNNER_TEMP "elan-x86_64-pc-windows-msvc.zip"
              $elanDir = Join-Path $env:RUNNER_TEMP "elan_init"
              Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile $elanZip
              Expand-Archive -Path $elanZip -DestinationPath $elanDir -Force
              & "$elanDir\elan-init.exe" -y --default-toolchain leanprover/lean4:stable
              $env:PATH = "$env:USERPROFILE\.elan\bin;$env:PATH"
          }
          Write-Host "Running lean compiler on 03_vault/lean4/SovereignManifoldTheorems.lean..." -ForegroundColor Cyan
          lean $leanVault
          if ($LASTEXITCODE -ne 0) { throw "lean compiler failed with exit $LASTEXITCODE" }

      - name: Run PowerShell Static Gatekeeper Invariants Audit (Cloud CI Mode)
        shell: pwsh
        run: |
          Write-Host "Executing 00_control/Invoke-BrutalAgentGatekeeper.ps1 -StaticOnly -CloudCiMode..." -ForegroundColor Cyan
          powershell -NoProfile -ExecutionPolicy Bypass -File "00_control/Invoke-BrutalAgentGatekeeper.ps1" -StaticOnly -CloudCiMode -RepoPath $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Invoke-BrutalAgentGatekeeper -StaticOnly -CloudCiMode failed" }
